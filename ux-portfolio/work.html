<!doctype html>
<html lang="en"><head><script>try{document.documentElement.dataset.theme=sessionStorage.getItem('cami-theme')==='light'?'light':'dark'}catch{document.documentElement.dataset.theme='dark'}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work — Cami Fang</title><meta name="description" content="Selected UX and product design projects by Cami Fang.">
<style>
*{box-sizing:border-box}html,body{min-height:100%;min-height:100svh}body{margin:0;background:#000;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.work-heading{position:absolute;top:125px;left:7%;z-index:2;pointer-events:none}.work-heading h1{font-weight:400;font-size:46px;letter-spacing:-1.7px;margin:0}.work-heading p{font-size:14px;color:#999;margin:12px 0 0}.work-disc{background:var(--work-canvas,#000);position:absolute;inset:210px 0 0;overflow:hidden;touch-action:pan-y;outline:none}.work-card{position:absolute;top:0;left:0;width:clamp(245px,25vw,340px);padding:12px 12px 17px;border:1px solid #242424;border-radius:22px;background:#111;display:block;will-change:transform;transform-origin:center;transition:border-color .25s,box-shadow .25s}.work-card:hover,.work-card:focus-visible{border-color:#747474;box-shadow:0 10px 30px #0005;outline:none}.work-card img{display:block;width:100%;height:205px;object-fit:cover;border-radius:12px;pointer-events:none}.work-card-title{display:flex;gap:12px;align-items:baseline;font-size:21px;font-weight:400;letter-spacing:-.4px;margin:16px 5px 6px}.work-card-title small{font-size:11px;color:#aaa;letter-spacing:0}.work-card p{font-size:11px;line-height:1.5;color:#aaa;margin:0 5px}.work-card .project-arrow{position:absolute;right:19px;bottom:48px;font-size:16px;color:#aaa}
@media(max-width:700px){.work-heading{top:112px;left:26px}.work-heading h1{font-size:36px}.work-heading p{font-size:12px}.work-disc{top:195px}.work-card{width:250px}.work-card img{height:170px}.work-card-title{font-size:19px}}
</style><link rel="stylesheet" href="/dark-theme.css"><link rel="stylesheet" href="/theme.css"></head><body class="work-page">
<header class="work-heading"><h1>Selected work</h1><p>Four projects, thoughtful experiences.</p></header><main class="work-disc" aria-label="Selected projects. Scroll, swipe, or use arrow keys to explore." tabindex="0"></main>
<script>
(()=>{
 const projects=[['Triply','Every step effortless.','triply'],['FluffBud','Soft on the outside, smart on the inside','fluffbud'],['M-echo','Meet Smarter, Connect Faster','m-echo'],['Reedy','Feel good. Stay ready.','reedy']];
 const disc=document.querySelector('.work-disc'),motion=matchMedia('(prefers-reduced-motion: reduce)');
 // Repeat the four projects around the full disc, so the lower arc loops continuously.
 const cards=Array.from({length:12},(_,i)=>{const [name,tag,slug]=projects[i%4],a=document.createElement('a');a.className='work-card';a.href='/work/'+slug+'/';a.setAttribute('aria-label','View '+name+' project');a.innerHTML='<img src="/assets/'+slug+'-wheel.png" alt="'+name+' project preview" draggable="false"><h2 class="work-card-title"><small>0'+(i%4+1)+'</small>'+name+'</h2><p>'+tag+'</p><span class="project-arrow" aria-hidden="true">↗</span>';disc.appendChild(a);return a});
 let rotation=Math.PI/12,velocity=0,last=0,hovered=false;
 disc.addEventListener('pointerover',e=>{hovered=Boolean(e.target.closest('.work-card'))});disc.addEventListener('pointerleave',()=>hovered=false);
 function draw(now){const dt=Math.min(now-last||16,40)/16;last=now;const focused=disc.contains(document.activeElement)&&document.activeElement!==disc;if(!hovered&&!focused){rotation+=velocity*dt;if(!motion.matches&&!document.hidden)rotation-=.0012*dt;velocity*=Math.pow(.93,dt)}
 const w=disc.clientWidth,h=disc.clientHeight,r=Math.max(570,Math.min(920,w*.68)),cx=w/2,cy=Math.max(h+r*.48,r+145),drift=motion.matches?0:Math.min(Math.abs(velocity)*1300,55);
 cards.forEach((card,i)=>{const angle=i*Math.PI/6+rotation,offset=Math.sin(now/450+i)*drift,x=cx+Math.sin(angle)*(r+offset),y=cy-Math.cos(angle)*(r+offset),visible=Math.cos(angle)>.18&&x>-210&&x<w+210;card.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-50%) rotate('+(angle*180/Math.PI%360)+'deg)';card.style.visibility=visible?'visible':'hidden';card.tabIndex=visible?0:-1;card.setAttribute('aria-hidden',String(!visible))});requestAnimationFrame(draw)}
 disc.addEventListener('wheel',e=>{e.preventDefault();hovered=false;velocity-=Math.max(-90,Math.min(90,e.deltaY+e.deltaX))*.00028;velocity=Math.max(-.05,Math.min(.05,velocity))},{passive:false});
 disc.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();hovered=false;velocity+=(e.key==='ArrowRight'||e.key==='ArrowUp'?.035:-.035)}});
 let touchY,touchX;disc.addEventListener('touchstart',e=>{touchY=e.touches[0].clientY;touchX=e.touches[0].clientX},{passive:true});disc.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];hovered=false;velocity-=(touchY-t.clientY+touchX-t.clientX)*.00035;velocity=Math.max(-.05,Math.min(.05,velocity));touchY=t.clientY;touchX=t.clientX},{passive:false});requestAnimationFrame(draw);
})();
</script><script src="/cursor-trail.js" defer></script><script src="/bubble-menu.js" defer></script><script src="/theme-toggle.js" defer></script></body></html>
