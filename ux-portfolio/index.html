<script>
const drum=document.querySelector('.drum'),dots=[...document.querySelectorAll('.dot')],progress=document.querySelector('.progress'),pause=document.querySelector('.pause');let step=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,timer,trigger;
const phases=[['Triply','Every step effortless.'],['FluffBud','Soft on the outside, smart on the inside'],['M-echo','Meet Smarter, Connect Faster'],['Reedy','Feel good. Stay ready.']];
const items=Array.from({length:12},(_,i)=>{const button=document.createElement('button'),index=i%4;button.className='wheel-item'+(index<=3?' has-photo':'');button.setAttribute('aria-label','Show 0'+(index+1)+' '+phases[index][0]);button.innerHTML='<span class="number">0'+(index+1)+'</span><span class="wheel-label">'+phases[index][0]+'<small>'+phases[index][1]+'</small></span>'+(index<=3?'<img class="wheel-photo" src="/assets/'+(['triply','fluffbud','m-echo','reedy'][index])+'-wheel.png" alt="'+phases[index][0]+' project preview">':'');button.addEventListener('click',()=>{const delta=((i-step+6)%12+12)%12-6;step+=delta;render();openBrowser(index)});drum.appendChild(button);return button});
function render(){const index=((step%4)+4)%4;items.forEach((item,i)=>{const delta=((i-step+6)%12+12)%12-6,distance=Math.abs(delta);item.style.setProperty('--angle',(delta*36)+'deg');item.style.setProperty('--opacity',distance===0?1:distance===1?.42:0);item.style.setProperty('--label-opacity',distance===0?1:.38);item.style.setProperty('--point-scale',distance===0?1.4:.65);item.tabIndex=distance<=1?0:-1;item.setAttribute('aria-hidden',distance>1);item.setAttribute('aria-pressed',distance===0);item.style.pointerEvents=distance<=1?'auto':'none'});dots.forEach((d,i)=>d.setAttribute('aria-pressed',i===index));progress.textContent='0'+(index+1)+' / 04'}
function restart(){clearInterval(timer);if(!paused&&!browserOpen)timer=setInterval(()=>{step++;render()},3400);pause.textContent=paused?'PLAY ▷':'PAUSE Ⅱ';pause.setAttribute('aria-label',paused?'Play animation':'Pause animation')}
dots.forEach((d,i)=>d.addEventListener('click',()=>{if(browserOpen){showSlide(i);return}const current=((step%4)+4)%4;step+=(i-current+6)%4-2;render();restart()}));pause.addEventListener('click',()=>{paused=!paused;restart()});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(timer);else restart()});let lastWheel=0;document.querySelector('.stage').addEventListener('wheel',e=>{if(browserOpen)return;if(Math.abs(e.deltaY)<8)return;e.preventDefault();if(Date.now()-lastWheel<1000)return;lastWheel=Date.now();step+=e.deltaY>0?1:-1;render();restart()},{passive:false});let startY;document.querySelector('.stage').addEventListener('touchstart',e=>startY=e.touches[0].clientY,{passive:true});document.querySelector('.stage').addEventListener('touchend',e=>{const delta=startY-e.changedTouches[0].clientY;if(!browserOpen&&Math.abs(delta)>35){step+=delta>0?1:-1;render();restart()}});
const stage=document.querySelector('.stage'),browserPanel=document.querySelector('.project-browser'),accordion=document.querySelector('.accordion');let browserOpen=false,slideIndex=0;const colors=['#e5eadc','#ece0da','#dfe6ef','#eae5d5'],initials=['T','fb','m~','r'];
const panels=phases.map((phase,i)=>{const panel=document.createElement('section');panel.className='accordion-panel';panel.style.setProperty('--panel-color',colors[i]);panel.innerHTML='<button class="accordion-trigger" role="tab" id="project-tab-'+i+'" aria-controls="project-content-'+i+'"><span class="project-no">0'+(i+1)+'</span><span>'+phase[0]+'</span></button><div class="accordion-content" id="project-content-'+i+'" role="tabpanel" aria-labelledby="project-tab-'+i+'"><p class="project-tagline">'+phase[1]+'</p><div class="project-art" aria-hidden="true"><span class="project-initial">'+initials[i]+'</span></div></div>';const button=panel.querySelector('button');button.addEventListener('click',()=>showSlide(i));button.addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?3:(slideIndex+(e.key==='ArrowRight'?1:3))%4;showSlide(next);panels[next].querySelector('button').focus()}});accordion.appendChild(panel);return panel});
function showSlide(index){const previous=slideIndex;slideIndex=(index+4)%4;const direction=slideIndex>=previous?1:-1,current=((step%4)+4)%4;step+=(slideIndex-current+6)%4-2;render();panels.forEach((panel,i)=>{const active=i===slideIndex;panel.style.setProperty('--entry',(direction*45)+'px');panel.classList.toggle('active',active);const button=panel.querySelector('button');button.setAttribute('aria-selected',active);button.tabIndex=active?0:-1;const content=panel.querySelector('.accordion-content');content.setAttribute('aria-hidden',!active);content.inert=!active});document.querySelector('.browser-counter').textContent='0'+(slideIndex+1)+' / 04'}

<script>
// Run the entrance once per document load; preserve the accessible text label.
document.querySelectorAll('.identity h1,.identity .role').forEach((line,row)=>{
 const text=line.textContent;line.setAttribute('aria-label',text);
 const fragment=document.createDocumentFragment();
 Array.from(text).forEach((letter,index)=>{const span=document.createElement('span');span.className='intro-letter';span.textContent=letter;span.setAttribute('aria-hidden','true');span.style.setProperty('--letter-delay',(100+row*230+index*48)+'ms');span.style.setProperty('--letter-tilt',Math.sin(index*.85)*9+'deg');fragment.appendChild(span)});
