<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reedy — Cami Fang</title><meta name="description" content="Reedy, a connected menstrual-care product and companion app by Cami Fang."><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f4;color:#20211f;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}button,a{color:inherit;font:inherit}button{cursor:pointer}a{text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #7c85c7;outline-offset:5px}.project-header{position:relative;z-index:2;padding:42px 6% 0;display:flex;align-items:flex-start;justify-content:space-between;gap:30px;pointer-events:none}.project-header>*{pointer-events:auto}.back{font-size:11px;color:#8b8f83;display:inline-flex;gap:12px;margin-bottom:24px}h1{font-size:54px;letter-spacing:-2.5px;font-weight:400;margin:0}.tagline{font-size:17px;color:#909489;letter-spacing:-.4px;margin:8px 0 0}.project-meta{max-width:270px;padding-top:47px}.project-meta p{font-size:12px;color:#8e9385;line-height:1.8;margin:0}.project-meta small{display:block;font-size:10px;color:#a0a597;margin-top:14px;letter-spacing:.4px}.gallery{position:absolute;inset:180px 0 50px;overflow:hidden;touch-action:pan-y;outline:none}.gallery:focus-visible{outline:none}.gallery-card{position:absolute;left:0;top:0;width:clamp(230px,27vw,350px);height:265px;padding:12px;border:0;border-radius:18px;background:#fff;box-shadow:0 13px 35px #3239280b;will-change:transform;display:flex;flex-direction:column;gap:10px}.gallery-card img{width:100%;height:211px;object-fit:contain;min-height:0;pointer-events:none}.gallery-card span{display:flex;justify-content:space-between;font-size:10px;color:#8b9180;padding:0 4px}.gallery-card:hover{box-shadow:0 18px 45px #32392818}.gallery-caption{position:fixed;bottom:31px;left:6%;right:6%;display:flex;justify-content:space-between;align-items:center;color:#929887;font-size:10px;letter-spacing:.6px}.gallery-controls{display:flex;gap:16px}.gallery-controls button{background:transparent;border:0;font-size:11px;padding:5px;color:#868d7a}dialog{border:0;padding:30px;background:#fff;border-radius:22px;width:min(1000px,calc(100vw - 60px));max-height:90svh;overflow:auto}dialog::backdrop{background:#f6f6f4e8;backdrop-filter:blur(12px)}.detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.detail-top h2{font-size:18px;letter-spacing:-.4px;font-weight:400;margin:0}.detail-close{border:0;background:#f4f5ef;border-radius:50%;width:34px;height:34px;font-size:20px}.detail-image{display:block;max-height:70svh;max-width:100%;width:auto;height:auto;margin:auto;object-fit:contain}.detail-nav{margin-top:20px;display:flex;justify-content:space-between}.detail-nav button{border:0;background:transparent;font-size:12px;color:#8a927c;padding:8px}.detail-count{font-size:11px;color:#9ca38f;align-self:center}@media(max-width:650px){.project-header{padding:27px 26px 0;gap:20px}h1{font-size:43px}.tagline{font-size:14px}.project-meta{padding-top:48px;max-width:142px}.project-meta p{font-size:10px}.project-meta small{font-size:9px}.gallery{inset:190px 0 65px}.gallery-card{width:255px;height:230px}.gallery-card img{height:177px}.gallery-caption{left:26px;right:26px;bottom:27px;font-size:9px}.gallery-controls{gap:5px}dialog{padding:20px;width:calc(100vw - 28px)}}
</style></head><body><header class="project-header"><div><h1>Reedy</h1><p class="tagline">Feel good. Stay ready.</p></div><div class="project-meta"><p>A connected menstrual-care product and companion app, helping young people feel informed, confident and ready.</p><small>UX research · Product design · Physical + digital</small></div></header><main class="gallery" tabindex="0" aria-label="Eight Reedy details. Scroll, swipe, or use arrow keys to browse."></main><dialog><div class="detail-top"><h2></h2><button class="detail-close" aria-label="Close detail">×</button></div><img class="detail-image" alt=""><div class="detail-nav"><button id="detail-prev">← Previous</button><span class="detail-count"></span><button id="detail-next">Next →</button></div></dialog>
<script>
const titles=['Desktop research','Empathy & insights','Similar products','Personas','Journey map','Design concept','Arduino prototype','Product experience'],gallery=document.querySelector('.gallery'),dialog=document.querySelector('dialog'),motion=matchMedia('(prefers-reduced-motion: reduce)');let rotation=0,velocity=0,lastFrame=0,paused=motion.matches,detailIndex=0,sourceButton;
const cards=titles.map((title,i)=>{const card=document.createElement('button');card.className='gallery-card';card.setAttribute('aria-label','Open detail '+(i+1)+': '+title);card.innerHTML='<img src="/assets/reedy-'+(i+1)+'.jpg" alt="'+title+'"><span><span>0'+(i+1)+' / '+title+'</span><span>↗</span></span>';card.addEventListener('click',()=>{sourceButton=card;showDetail(i);dialog.showModal()});gallery.appendChild(card);return card});
function draw(now){const elapsed=Math.min(now-lastFrame||16,40)/16;lastFrame=now;if(!dialog.open){rotation+=velocity*elapsed;if(!paused)rotation+=.00065*elapsed;velocity*=Math.pow(.93,elapsed)}const width=gallery.clientWidth,height=gallery.clientHeight,radius=Math.max(380,Math.min(width*.62,800)),centerX=width/2,centerY=height+radius*.48,drift=motion.matches?0:Math.min(Math.abs(velocity)*2000,85);cards.forEach((card,i)=>{const angle=i*Math.PI/4+rotation,offset=Math.sin(now/450+i)*drift,x=centerX+Math.sin(angle)*(radius+offset),y=centerY-Math.cos(angle)*(radius+offset),front=Math.cos(angle)>.05;card.style.transform='translate('+x+'px,'+y+'px) translate(-50%,-50%) rotate('+(Math.sin(angle)*25)+'deg)';card.style.visibility=front?'visible':'hidden';card.tabIndex=front?0:-1});requestAnimationFrame(draw)}
gallery.addEventListener('wheel',event=>{event.preventDefault();velocity+=Math.max(-80,Math.min(80,event.deltaY+event.deltaX))*.00032;velocity=Math.max(-.055,Math.min(.055,velocity))},{passive:false});let lastY,lastX;gallery.addEventListener('touchstart',e=>{lastY=e.touches[0].clientY;lastX=e.touches[0].clientX},{passive:true});gallery.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];velocity+=(lastY-t.clientY+lastX-t.clientX)*.0004;velocity=Math.max(-.055,Math.min(.055,velocity));lastY=t.clientY;lastX=t.clientX},{passive:false});gallery.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();velocity+=(e.key==='ArrowRight'||e.key==='ArrowDown'?.03:-.03)}});motion.addEventListener('change',()=>{paused=motion.matches});
function showDetail(i){detailIndex=(i+8)%8;dialog.querySelector('h2').textContent=titles[detailIndex];const image=dialog.querySelector('img');image.src='/assets/reedy-'+(detailIndex+1)+'.jpg';image.alt=titles[detailIndex];dialog.querySelector('.detail-count').textContent='0'+(detailIndex+1)+' / 08'}document.querySelector('.detail-close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});dialog.addEventListener('close',()=>sourceButton?.focus());document.querySelector('#detail-prev').onclick=()=>showDetail(detailIndex-1);document.querySelector('#detail-next').onclick=()=>showDetail(detailIndex+1);requestAnimationFrame(draw);
</script><script src="/cursor-trail.js" defer></script></body></html>
